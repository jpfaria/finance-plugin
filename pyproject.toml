[project]
name = "finance"
version = "0.1.0"
description = "Controle financeiro pessoal via Claude Code"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12",
  "pyyaml>=6",
  "python-ulid>=2",
  "rich>=13",
  "ofxparse>=0.21",
]

[project.scripts]
finance = "finance.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finance"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[[tool.mypy.overrides]]
# reason: ofxparse ships no type stubs; every value crossing this boundary is
# converted to Decimal/date/str inside finance.imports.ofx, so nothing untyped leaks.
module = ["ofxparse.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# reason: ofxparse calls bs4 findAll (deprecated upstream); not ours to fix, keep the run clean.
filterwarnings = ["ignore::DeprecationWarning:ofxparse"]
